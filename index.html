<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YUKON FLAMES · BECK VOCAL</title>
    <style>
        /* ===== БАЗА ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #0b0b0b;
            font-family: 'Arial Narrow', 'Impact', Arial, sans-serif;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #eaff00;
            line-height: 1.2;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            display: flex;
        }

        /* ===== ЛЕВАЯ ПАНЕЛЬ ===== */
        .sidebar {
            width: 40%;
            min-width: 300px;
            max-width: 500px;
            background: #111;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .top-header {
            padding: 1.2rem;
            border-bottom: 4px solid #eaff00;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-shrink: 0;
        }
        .top-header h1 { font-size: 1.4rem; transform: skewX(-5deg); text-shadow: 3px 3px 0 #000; }
        .top-header span { font-size: 0.7rem; color: #888; }

        .songs-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .song-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-left: 4px solid #333;
            padding: 0.8rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .song-item:hover { background: #222; }
        .song-item.active {
            border-color: #eaff00;
            border-left: 4px solid #eaff00;
            background: #252525;
        }
        .song-title { font-size: 1rem; color: #eaff00; }
        .song-icon { font-size: 1rem; color: #666; }
        .song-item.active .song-icon { color: #eaff00; }

        /* ===== ПРАВАЯ ПАНЕЛЬ ===== */
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: repeating-linear-gradient(-45deg, #0b0b0b, #0b0b0b 15px, #151515 15px, #151515 30px);
            height: 100%;
            overflow: hidden;
        }

        /* ПЛЕЕР СВЕРХУ (Нативный, стилизованный) */
        .player-bar {
            background: #000;
            border-bottom: 2px solid #eaff00;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            flex-shrink: 0;
            z-index: 10;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .player-text { color: #fff; font-size: 0.9rem; font-weight: 900; }
        .player-status { color: #eaff00; font-size: 0.7rem; }

        /* Стилизация нативного аудио-плеера под наш дизайн */
        audio {
            width: 100%;
            height: 40px;
            outline: none;
            /* Желтый фон для контролов, чтобы вписывалось в тему */
            background-color: #eaff00; 
            border: 2px solid #000;
            border-radius: 0; /* Острые углы */
        }

        /* Попытка перекрасить ползунок в Chrome/Android */
        audio::-webkit-media-controls-panel {
            background-color: #eaff00;
        }
        audio::-webkit-media-controls-play-button,
        audio::-webkit-media-controls-mute-button {
            background-color: #000;
            border-radius: 0;
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #000;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        /* КОНТЕНТ */
        .cover-area {
            flex: 1;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .current-title {
            font-size: 2rem;
            color: #eaff00;
            text-shadow: 3px 3px 0 #000;
            transform: skewX(-5deg);
            margin-bottom: 1rem;
            flex-shrink: 0;
            word-wrap: break-word;
        }

        .notes-box {
            background: rgba(234, 255, 0, 0.95);
            color: #000;
            padding: 1rem;
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
            text-transform: none;
            line-height: 1.4;
            border-left: 6px solid #000;
            box-shadow: 4px 4px 0 #000;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }
        .notes-box p { margin-bottom: 0.4rem; }

        .tracks-list {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .track-btn {
            background: #111;
            border: 1px solid #333;
            color: #ccc;
            padding: 0.6rem 0.8rem;
            font-family: inherit;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
        }
        .track-btn:hover { border-color: #eaff00; }
        .track-btn.playing {
            background: #eaff00;
            color: #000;
            border-color: #eaff00;
        }

        /* АДАПТИВ */
        @media (max-width: 800px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 35vh; border-right: none; border-bottom: 2px solid #333; }
            .main-panel { height: 65vh; }
            .cover-area { padding: 1rem; }
            .current-title { font-size: 1.6rem; margin-bottom: 0.8rem; }
            .notes-box { font-size: 0.85rem; padding: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="top-header">
            <h1>YUKON FLAMES</h1>
            <span>BACK VOCAL</span>
        </div>
        <div class="songs-list" id="songsList"></div>
    </div>

    <div class="main-panel">
        <!-- НАТИВНЫЙ ПЛЕЕР -->
        <div class="player-bar">
            <div class="player-info">
                <div class="player-text" id="uiPlayerTitle">Трек не выбран</div>
            </div>
            <!-- Встроенный плеер магнитолы. Он не лагает. -->
            <audio id="mainAudio" controls preload="metadata"></audio>
        </div>

        <div class="cover-area">
            <h2 class="current-title" id="uiTitle">Выберите песню</h2>
            <div class="notes-box" id="uiNotes">
                <p>Нажмите на песню слева.</p>
            </div>
            <div class="tracks-list" id="uiTracks"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. КЕШИРОВАНИЕ
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
            });
        }

        // ==========================================
        // 2. БАЗА ДАННЫХ
        // ==========================================
        const database = [
            { id: "amnezia", title: "Амнезия", notes: "<p>▸ Работать над окончаниями.</p>", tracks: [
                { type: "Бек-вокал", src: "бекпартии/Амнезия.mp3" },
                { type: "Без вокала", src: "инструментал/Yukon Flames - Амнезия[rebalanced].mp3" },
                { type: "С вокалом", src: "полноценные/Yukon Flames - Амнезия.mp3" } ] },
            { id: "megapolis", title: "Мегаполис", notes: "<p>▸ Стеклаа — четко.</p><p>▸ Уеду туда гдеее — тянешь, мимо нот.</p><p>▸ Попадать в тайминг.</p>", tracks: [
                { type: "Бек-вокал", src: "бекпартии/Мегаполис.mp3" },
                { type: "Без вокала", src: "инструментал/Yukon Flames - Мегаполис[rebalanced].mp3" },
                { type: "С вокалом", src: "полноценные/Yukon Flames - Мегаполис.mp3" } ] },
            { id: "zachem", title: "Зачем", notes: "<p>▸ делать, верить — мимо.</p><p>▸ Уууээээоооо — нужно увереннее.</p><p>▸ Остальная часть не разобрана.</p>", tracks: [
                { type: "Бек-вокал", src: "бекпартии/Зачем.mp3" },
                { type: "Делать, верить", src: "бекпартии/Зачем-делать-верить.mp3" },
                { type: "Аэо Гизара", src: "бекпартии/Зачем-Аэо-Гизара.mp3" },
                { type: "Без вокала", src: "инструментал/Yukon Flames - Зачем[rebalanced].mp3" },
                { type: "С вокалом", src: "полноценные/Yukon Flames - Зачем_.mp3" } ] },
            { id: "pronas", title: "Про нас", notes: "<p>▸ Припев у-у-у — пониже.</p><p>▸ Уехать с тобой в закат — мимо.</p><p>▸ В конце ааааа — вяло.</p>", tracks: [
                { type: "Бек-вокал", src: "бекпартии/Про-нас.mp3" },
                { type: "Без вокала", src: "инструментал/Yukon Flames - Про Нас[rebalanced].mp3" },
                { type: "С вокалом", src: "полноценные/Yukon Flames - Про Нас.mp3" } ] },
            { id: "otpusk", title: "Отпуск", notes: "<p>▸ Замечаний нет.</p>", tracks: [
                { type: "Без вокала", src: "инструментал/Yukon Flames - Отпуск[rebalanced].mp3" },
                { type: "С вокалом", src: "полноценные/Yukon - Отпуск.mp3" } ] },
            { id: "menyanet", title: "Меня больше нет", notes: "<p>▸ Замечаний нет.</p>", tracks: [
                { type: "Бек-вокал", src: "бекпартии/Меня-больше-нет.mp3" },
                { type: "Без вокала", src: "инструментал/Yukon Flames - Меня больше нет[rebalanced].mp3" },
                { type: "С вокалом", src: "полноценные/Yukon Flames - Меня больше нет.mp3" } ] },
            { id: "student", title: "Про Ленивого Студента", notes: "<p>▸ шундый — мимо.</p><p>▸ Башка бер нэрсэ керми — лучше.</p><p>▸ Киреееек в конце — не тянуть.</p>", tracks: [
                { type: "Бек-вокал", src: "бекпартии/Простудента.wav" },
                { type: "Без вокала", src: "инструментал/Yukon Flames - Песня Про Ленивого Студента[rebalanced].mp3" },
                { type: "С вокалом", src: "полноценные/Yukon Flames - Песня Про Ленивого Студента.mp3" } ] }
        ];

        // ==========================================
        // 3. ЛОГИКА (БЕЗ ЛАГОВ)
        // ==========================================
        let playlist = [];
        database.forEach(song => { song.tracks.forEach(track => { playlist.push({ songId: song.id, songTitle: song.title, type: track.type, src: track.src }); }); });

        const songsListEl = document.getElementById('songsList');
        const uiTitle = document.getElementById('uiTitle');
        const uiNotes = document.getElementById('uiNotes');
        const uiTracks = document.getElementById('uiTracks');
        const mainAudio = document.getElementById('mainAudio');
        const uiPlayerTitle = document.getElementById('uiPlayerTitle');

        let currentIndex = -1;
        let currentSongId = null;

        // Отрисовка списка (делается 1 раз)
        function initSongList() {
            database.forEach(song => {
                const div = document.createElement('div');
                div.className = 'song-item';
                div.dataset.id = song.id;
                div.innerHTML = `<span class="song-title">${song.title}</span><span class="song-icon">▶</span>`;
                div.onclick = () => selectSong(song.id);
                songsListEl.appendChild(div);
            });
        }

        // Клик по песне
        function selectSong(songId) {
            const song = database.find(s => s.id === songId);
            if (!song) return;
            currentSongId = songId;

            document.querySelectorAll('.song-item').forEach(el => { el.classList.toggle('active', el.dataset.id === songId); });

            uiTitle.textContent = song.title;
            uiNotes.innerHTML = song.notes;
            
            uiTracks.innerHTML = '';
            song.tracks.forEach(track => {
                const globalIdx = playlist.findIndex(p => p.src === track.src);
                const btn = document.createElement('button');
                btn.className = 'track-btn';
                btn.textContent = track.type;
                if (currentIndex === globalIdx && !mainAudio.paused) btn.classList.add('playing');
                
                // При клике на кнопку трека меняем src и запускаем
                btn.onclick = () => {
                    document.querySelectorAll('.track-btn').forEach(b => b.classList.remove('playing'));
                    if (currentIndex === globalIdx && !mainAudio.paused) {
                        mainAudio.pause();
                    } else {
                        btn.classList.add('playing');
                        playTrack(globalIdx);
                    }
                };
                uiTracks.appendChild(btn);
            });

            const firstTrackGlobalIdx = playlist.findIndex(p => p.songId === songId);
            if (firstTrackGlobalIdx !== -1) {
                uiTracks.children[0].classList.add('playing');
                playTrack(firstTrackGlobalIdx);
            }
        }

        // Запуск трека
        function playTrack(globalIndex) {
            if (globalIndex < 0 || globalIndex >= playlist.length) return;
            currentIndex = globalIndex;
            const track = playlist[currentIndex];
            
            mainAudio.src = track.src;
            mainAudio.play().catch(e => console.log("Ошибка воспроизведения"));
            uiPlayerTitle.textContent = `${track.songTitle} — ${track.type}`;
        }

        // АВТОПЕРЕХОД на следующий трек (когда заканчивается)
        mainAudio.onended = () => {
            currentIndex++;
            if (currentIndex >= playlist.length) currentIndex = 0; // Зацикливаем весь плейлист
            
            const track = playlist[currentIndex];
            mainAudio.src = track.src;
            mainAudio.play();
            uiPlayerTitle.textContent = `${track.songTitle} — ${track.type}`;

            // Подсвечиваем кнопку трека, если открыта эта песня
            if (currentSongId === track.songId) {
                const song = database.find(s => s.id === currentSongId);
                song.tracks.forEach((t, idx) => {
                    const btn = uiTracks.children[idx];
                    if (btn) {
                        const globalIdx = playlist.findIndex(p => p.src === t.src);
                        btn.classList.toggle('playing', globalIdx === currentIndex);
                    }
                });
            }
        };

        // Инициализация при старте
        initSongList();
        if (database.length > 0) {
            currentSongId = database[0].id;
            document.querySelector(`.song-item[data-id="${database[0].id}"]`).classList.add('active');
            uiTitle.textContent = database[0].title;
            uiNotes.innerHTML = database[0].notes;
            database[0].tracks.forEach((track, idx) => {
                const btn = document.createElement('button');
                btn.className = 'track-btn';
                btn.textContent = track.type;
                if (idx === 0) btn.classList.add('playing');
                btn.onclick = () => {
                    document.querySelectorAll('.track-btn').forEach(b => b.classList.remove('playing'));
                    btn.classList.add('playing');
                    const globalIdx = playlist.findIndex(p => p.src === track.src);
                    playTrack(globalIdx);
                };
                uiTracks.appendChild(btn);
            });
        }
    </script>
</body>
</html>
